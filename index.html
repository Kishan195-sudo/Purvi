<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Purnima</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #d63384; font-size: 1.8rem; min-height: 80px; }
        .buttons { margin-top: 30px; position: relative; height: 150px; }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #yesBtn, #yesBtn2 { background-color: #ff4d6d; color: white; }
        #noBtn, #noBtn2 {
            background-color: #6c757d;
            color: white;
            position: absolute;
            left: 55%;
        }
        .hidden { display: none; }
        img { width: 150px; margin-bottom: 10px; border-radius: 10px; }
        p { color: #666; font-size: 1.1rem; }
        #restartBtn {
            background-color: #ff4d6d;
            color: white;
            padding: 12px 25px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- PHASE 1: MARRIAGE PROPOSAL -->
    <div class="container" id="quizCard">
        <img id="displayGif" src="https://media4.giphy.com/media/eTBc0Z1ij5zYEJseSl/giphy.gif" alt="Cute GIF">
        <h1 id="questionText">Purnima, kya tum mujhe apni ho forever? 💍</h1>
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- PHASE 2: LOVE QUIZ (After marriage yes) -->
    <div class="container hidden" id="loveQuizCard">
        <img id="loveGif" src="https://media4.giphy.com/media/xTiTnBMEz7zAKxFiSe/giphy.gif" alt="Love GIF">
        <h1 id="loveQuestionText">Kya tum mujhe apne pore dil se pyar karte ho? 💗</h1>
        <div class="buttons">
            <button id="yesBtn2">Yes</button>
            <button id="noBtn2">No</button>
        </div>
    </div>

    <!-- FINAL CARD -->
    <div class="container hidden" id="finalCard">
        <img src="https://media4.giphy.com/media/l0HlF7Vx2O1vJAiBAP/giphy.gif" alt="Forever GIF">
        <h1>Aapka jawab toh bas "Yes" tha har baar! 😘</h1>
        <p>Mrs. Purnima, I'm the luckiest man alive! 💍✨</p>
        <p>30th April aur Tokyo trip, dono ka wait hai! 🏯💐</p>
        <button id="restartBtn">Again?</button>
    </div>

    <script>
        const proposalQuestions = [
            "Purnima, kya tum mujhe apni ho forever? 💍",
            "Kya tum har adventure mein mere saath hogi? 🗺️",
            "Kya tum mere liye ek ghar ban sakte ho? 🏡",
            "Kya tum mujhe mere best aur worst days mein love kar sakte ho? 😊💔",
            "Kya tum mere saath ek beautiful life banogi? 🌟"
        ];

        const loveQuestions = [
            "Kya tum mujhe apne pore dil se pyar karte ho? 💗",
            "Kya tum meri sabse badi cheerleader banogi? 📣",
            "Kya tum mujhe maaf kar sakte ho jab main galti karu? 🙏",
            "Kya tum mujhe barish mein naach na chaogi? 🌧️💃",
            "Kya tum apne future mein mujhe dekh sakte ho? 🔮",
            "Kya tum hamesha mere sath sachche raogi? 💯",
            "Kya tum forever ke liye mere sath ready ho? ♾️💑"
        ];

        let currentProposalIndex = 0;
        let currentLoveIndex = 0;

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionText = document.getElementById('questionText');
        const quizCard = document.getElementById('quizCard');
        const loveQuizCard = document.getElementById('loveQuizCard');
        const loveQuestionText = document.getElementById('loveQuestionText');
        const yesBtn2 = document.getElementById('yesBtn2');
        const noBtn2 = document.getElementById('noBtn2');
        const finalCard = document.getElementById('finalCard');
        const restartBtn = document.getElementById('restartBtn');

        function moveNoButton(btn) {
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 50);
            
            btn.style.position = 'fixed';
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;
            btn.style.zIndex = '9999';
        }

        // PHASE 1: PROPOSAL QUESTIONS
        noBtn.addEventListener('mouseover', () => moveNoButton(noBtn));
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton(noBtn);
        });

        yesBtn.addEventListener('click', () => {
            currentProposalIndex++;

            if (currentProposalIndex < proposalQuestions.length) {
                questionText.innerText = proposalQuestions[currentProposalIndex];
                noBtn.style.position = 'absolute';
                noBtn.style.left = '55%';
                noBtn.style.top = 'auto';
            } else {
                // TRANSITION TO PHASE 2: LOVE QUIZ
                quizCard.classList.add('hidden');
                loveQuizCard.classList.remove('hidden');
                currentLoveIndex = 0;
                loveQuestionText.innerText = loveQuestions[currentLoveIndex];
            }
        });

        // PHASE 2: LOVE QUIZ QUESTIONS
        noBtn2.addEventListener('mouseover', () => moveNoButton(noBtn2));
        noBtn2.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton(noBtn2);
        });

        yesBtn2.addEventListener('click', () => {
            currentLoveIndex++;

            if (currentLoveIndex < loveQuestions.length) {
                loveQuestionText.innerText = loveQuestions[currentLoveIndex];
                noBtn2.style.position = 'absolute';
                noBtn2.style.left = '55%';
                noBtn2.style.top = 'auto';
            } else {
                // FINAL CARD
                loveQuizCard.classList.add('hidden');
                finalCard.classList.remove('hidden');
            }
        });

        // RESTART
        restartBtn.addEventListener('click', () => {
            currentProposalIndex = 0;
            currentLoveIndex = 0;
            finalCard.classList.add('hidden');
            quizCard.classList.remove('hidden');
            questionText.innerText = proposalQuestions[0];
            noBtn.style.position = 'absolute';
            noBtn.style.left = '55%';
            noBtn.style.top = 'auto';
        });
    </script>
</body>
</html>
